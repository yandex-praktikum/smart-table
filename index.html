<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <link rel="icon" type="image/svg+xml" href="/vite.svg"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Data Table App</title>
</head>
<body>
<main id="app" class="container">
    <form name="table" class="table" style="--columns: 1fr 1fr 1fr 1fr" role="table" aria-label="Data table">

        <!-- Поиск и сброс -->
        <div class="search-bar">
            <label class="search-wrapper">
                <i class="icon search-icon" aria-hidden="true"></i>
                <input type="text" name="search" class="input" placeholder="Search" data-name="search">
            </label>
            <button type="button" name="reset" class="button reset-wrapper" data-name="reset">
                Reset all filters
                <i class="icon reset-icon" aria-hidden="true"></i>
            </button>
        </div>

        <!-- Заголовки колонок и кнопки сортировки -->
        <div class="table-row header-row" role="rowgroup">
            <div class="table-column" role="columnheader">
                <div class="sortable">
                    Date
                    <button type="button" name="sort" data-field="date" data-value="none" class="icon" data-name="sortByDate" aria-label="Sort by date"></button>
                </div>
            </div>
            <div class="table-column" role="columnheader">Customer</div>
            <div class="table-column" role="columnheader">Seller</div>
            <div class="table-column" role="columnheader">
                <div class="sortable">
                    Total
                    <button type="button" name="sort" data-field="total" data-value="none" class="icon" data-name="sortByTotal" aria-label="Sort by total"></button>
                </div>
            </div>
        </div>

        <!-- Фильтры: продавец и сумма «от — до» -->
        <div class="table-row filter-row" data-name="filter" role="rowgroup">
            <div class="table-column"></div>
            <div class="table-column"></div>
            <div class="table-column">
                <label class="dropdown-select">
                    <select name="seller" data-name="searchBySeller" aria-label="Filter by seller">
                        <option value="" selected>—</option>
                    </select>
                </label>
            </div>
            <div class="table-column">
                <div class="range-inputs">
                    <input type="text" class="input" placeholder="from" name="totalFrom" data-name="totalFrom" aria-label="Total from">
                    <input type="text" class="input" placeholder="to" name="totalTo" data-name="totalTo" aria-label="Total to">
                </div>
            </div>
        </div>

        <!-- Строки таблицы -->
        <div class="table-content" data-name="rows" role="rowgroup"></div>

        <!-- Пагинация -->
        <div class="pagination-container">
            <div class="pagination-controls">
                <button type="button" name="first" class="pagination-button" data-name="firstPage" aria-label="First page">
                    <i class="icon chevrons-left" aria-hidden="true"></i>
                </button>
                <button type="button" name="prev" class="pagination-button" data-name="previousPage" aria-label="Previous page">
                    <i class="icon left" aria-hidden="true"></i>
                </button>
                <div class="pagination-pages" data-name="pages" role="group" aria-label="Page navigation"></div>
                <button type="button" name="next" class="pagination-button" data-name="nextPage" aria-label="Next page">
                    <i class="icon right" aria-hidden="true"></i>
                </button>
                <button type="button" name="last" class="pagination-button" data-name="lastPage" aria-label="Last page">
                    <i class="icon chevrons-right" aria-hidden="true"></i>
                </button>
            </div>
            <div class="pagination-settings">
                <div class="pagination-status">
                    Showing <span data-name="fromRow">0</span>
                    to <span data-name="toRow">0</span>
                    of <span data-name="totalRows">0</span> entries
                </div>
                <label class="dropdown-select rows-per-page">
                    <select name="rowsPerPage" data-name="rowsPerPage" aria-label="Rows per page">
                        <option value="10">10</option>
                        <option value="25">25</option>
                        <option value="50">50</option>
                        <option value="100">100</option>
                    </select>
                </label>
            </div>
        </div>
    </form>
</main>

<!-- Шаблон строки таблицы -->
<template id="row">
    <div class="table-row" role="row">
        <div class="table-column" data-name="date" role="cell"></div>
        <div class="table-column" data-name="customer" role="cell"></div>
        <div class="table-column" data-name="seller" role="cell"></div>
        <div class="table-column" data-name="total" role="cell"></div>
    </div>
</template>

<!-- Шаблон кнопки с номером страницы -->
<template id="page">
    <button type="button" name="page" class="pagination-button" aria-label="Go to page"></button>
</template>

<script type="module" src="/src/main.js"></script>
</body>
</html>
